<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agência Criativa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: #ffffff; 
            min-height: 100vh;
        }
        header { 
            padding: 40px 60px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { 
            font-size: 2.5rem; 
            margin: 0; 
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-nav {
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
            padding: 60px 40px; 
        }
        .item { 
            position: relative;
            height: 350px; 
            border-radius: 20px; 
            display: flex; 
            align-items: flex-end; 
            padding: 30px;
            font-size: 1.8rem; 
            font-weight: 500;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: transform 0.6s ease;
        }
        
        .item::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0) 100%);
            z-index: -1;
        }

        .item:nth-child(1)::before { background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); }
        .item:nth-child(2)::before { background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); }
        .item:nth-child(3)::before { background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); }
        .item:nth-child(4)::before { background-image: url('https://images.unsplash.com/photo-1522542550221-31fd19575a2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); }
        .item:nth-child(5)::before { background-image: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); }
        .item:nth-child(6)::before { background-image: url('https://images.unsplash.com/photo-1542744173-8e7e53415bb0?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); }

        .item:hover { 
            cursor: pointer; 
            transform: translateY(-10px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .item:hover::before {
            transform: scale(1.1);
        }
        
        .item span {
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
            display: block;
            font-size: 1rem;
            font-weight: 300;
            margin-top: 8px;
            color: #feca57;
        }

        .item:hover span {
            transform: translateY(0);
            opacity: 1;
        }
        
        .item-content {
            display: flex;
            flex-direction: column;
        }
        
    </style>
</head>
<body>
    <header>
        <h1>Agência Criativa</h1>
        <div class="header-nav">Portfolio</div>
    </header>
    <div class="container">
        <div class="grid">
            <div class="item">
                <div class="item-content">
                    Projeto Alpha
                    <span>Identidade Visual</span>
                </div>
            </div>
            <div class="item">
                <div class="item-content">
                    Projeto Beta
                    <span>Design de Interface (UI/UX)</span>
                </div>
            </div>
            <div class="item">
                <div class="item-content">
                    Projeto Gamma
                    <span>Desenvolvimento Web</span>
                </div>
            </div>
            <div class="item">
                <div class="item-content">
                    Projeto Delta
                    <span>E-commerce</span>
                </div>
            </div>
            <div class="item">
                <div class="item-content">
                    Projeto Epsilon
                    <span>Marketing Digital</span>
                </div>
            </div>
            <div class="item">
                <div class="item-content">
                    Projeto Zeta
                    <span>Aplicativo Mobile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
